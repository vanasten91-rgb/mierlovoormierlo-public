name: Hub contracts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-contracts:
    name: hub-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source and publication provenance
        shell: bash
        run: |
          set -euo pipefail
          expected_sha='${{ github.event.pull_request.head.sha || github.sha }}'
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$expected_sha"

          expected_plugins='10882baf51e54750391212d8228a69f47d38a0c8'
          expected_themes='278f6089230fdd84e3a88043e68a98f5e38fb0ec'
          expected_tests='8730ce0c8c458d320654e1d35e06467cb858ed48'

          actual_plugins="$(git rev-parse HEAD:plugins)"
          actual_themes="$(git rev-parse HEAD:themes)"
          actual_tests="$(git rev-parse HEAD:tests)"

          test "$actual_plugins" = "$expected_plugins"
          test "$actual_themes" = "$expected_themes"
          test "$actual_tests" = "$expected_tests"

          echo "Exact source: $actual_sha"
          echo "plugins tree: $actual_plugins"
          echo "themes tree: $actual_themes"
          echo "sanitized tests tree: $actual_tests"

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find plugins tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Check JavaScript contract syntax
        shell: bash
        run: |
          set -euo pipefail
          find tests -maxdepth 1 -type f -name '*.cjs' -print0 \
            | xargs -0 -n1 node --check

      - name: Run portable Hub smoke tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/mvm-hub-bootstrap-smoke.php
            tests/mvm-hub-route-runtime-smoke.php
            tests/mvm-hub-v5-policy-smoke.php
            tests/mvm-hub-v5-preview-smoke.php
            tests/mvm-hub-v5-work-item-service-smoke.php
            tests/mvm-hub-v5-domain-event-outbox-smoke.php
            tests/mvm-hub-v5-cross-domain-smoke.php
            tests/mvm-hub-v5-intake-owner-smoke.php
            tests/mvm-hub-v5-agenda-owner-smoke.php
            tests/mvm-hub-v5-read-provider-smoke.php
            tests/mvm-hub-v5-search-policy-smoke.php
            tests/mvm-hub-v5-media-submission-policy-smoke.php
            tests/mvm-hub-v5-search-read-model-smoke.php
            tests/mvm-hub-v5-collaboration-smoke.php
            tests/mvm-hub-v5-communications-preview-smoke.php
            tests/mvm-hub-v5-community-layout-smoke.php
            tests/mvm-hub-mail-attachment-policy-smoke.php
            tests/mvm-hub-cloudmersive-attachment-scanner-smoke.php
            tests/mvm-hub-v5-mail-compose-attachment-smoke.php
            tests/mvm-hub-v5-mail-read-actions-smoke.php
            tests/mvm-hub-v5-mail-provider-stack-smoke.php
            tests/mvm-hub-v5-mail-application-smoke.php
            tests/mvm-hub-v5-mail-v2-smoke.php
          )

          for test_file in "${tests[@]}"; do
            echo "Running ${test_file}"
            php "${test_file}"
          done

      - name: Build deterministic MvM Hub release ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          source = Path('plugins/mvm-hub')
          output = Path('dist/mvm-hub.zip')
          files = sorted((p for p in source.rglob('*') if p.is_file()), key=lambda p: p.as_posix())
          if not files:
              raise SystemExit('mvm-hub source tree is empty')

          with ZipFile(output, 'w') as archive:
              for path in files:
                  relative = (Path('mvm-hub') / path.relative_to(source)).as_posix()
                  info = ZipInfo(relative, date_time=(1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = (0o100644 & 0xFFFF) << 16
                  archive.writestr(
                      info,
                      path.read_bytes(),
                      compress_type=ZIP_DEFLATED,
                      compresslevel=9,
                  )
          PY

          python3 - <<'PY'
          import re
          from zipfile import ZipFile

          with ZipFile('dist/mvm-hub.zip') as archive:
              names = archive.namelist()
          if 'mvm-hub/mvm-hub.php' not in names:
              raise SystemExit('artifact does not contain mvm-hub/mvm-hub.php')
          forbidden = [
              name for name in names
              if re.search(r'(^|/)(\.env|.*\.pem|.*\.key|private-storage|runtime-private)(/|$)', name)
          ]
          if forbidden:
              raise SystemExit('forbidden private/secret artifact entries: ' + ', '.join(forbidden))
          PY

      - name: Write exact release evidence
        shell: bash
        run: |
          set -euo pipefail
          source_sha='${{ github.event.pull_request.head.sha || github.sha }}'
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$source_sha"

          plugins_tree="$(git rev-parse HEAD:plugins)"
          themes_tree="$(git rev-parse HEAD:themes)"
          tests_tree="$(git rev-parse HEAD:tests)"
          zip_sha="$(sha256sum dist/mvm-hub.zip | awk '{print $1}')"
          zip_size="$(stat -c '%s' dist/mvm-hub.zip)"
          file_count="$(find plugins/mvm-hub -type f | wc -l | tr -d ' ')"

          printf '%s  %s\n' "$zip_sha" 'mvm-hub.zip' > dist/mvm-hub.zip.sha256
          cat > dist/release-evidence.txt <<EOF
          repository=vanasten91-rgb/mierlovoormierlo-public
          source_commit=$source_sha
          provenance_private_source_commit=380f9da760a73dedffa11f9a650851de0cb89e60
          plugins_git_tree=$plugins_tree
          themes_git_tree=$themes_tree
          sanitized_tests_git_tree=$tests_tree
          artifact=mvm-hub.zip
          artifact_sha256=$zip_sha
          artifact_size_bytes=$zip_size
          artifact_source_file_count=$file_count
          required_check=hub-contracts
          runner=github-hosted-ubuntu
          production_connection=false
          EOF
          sha256sum dist/release-evidence.txt > dist/release-evidence.txt.sha256

          cat dist/release-evidence.txt

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvm-hub-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/mvm-hub.zip
            dist/mvm-hub.zip.sha256
            dist/release-evidence.txt
            dist/release-evidence.txt.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
